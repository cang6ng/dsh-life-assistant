# The chinook-dsh-plugin bundle patch: mounts the Chinook Music Store business
# plugin as composition row `chinook`. Base-backed profiles compose this bundle
# (ordered after @deepseek-ai/dsh-base in dsh.profile.bundles), so the row's
# tools, prompt section and session guard land on top of the DSH core rows.
#
# The row `name` is the npm package specifier; the Loader resolves it through
# the profile's module path (the $DSH_HOME/profiles/node_modules mirror plus
# the repo's own node_modules), so no install step beyond the repo's pnpm
# install is required.
- insert:
    - id: chinook
      name: 'chinook-dsh-plugin'
