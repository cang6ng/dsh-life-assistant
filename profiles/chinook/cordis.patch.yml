# Chinook profile patch (spec §36): keep the smallest runnable capability set.
#
# dsh-base composes the shared core rows (llm, session, agent, agent-loop,
# tools, system-prompt, session-persistence-jsonl, ...). The rows disabled
# here are the capability families the V1 profile must NOT load — shell,
# filesystem, web, subagent, skills, goals, jobs and companion commands.
# Rows are addressed by id; the last patch layer wins per row.

# ── shell / subprocess families (no shell tools in V1) ────────────────────────
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# ── filesystem (read/write/search/editor) ─────────────────────────────────────
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true

# ── web search / fetch ────────────────────────────────────────────────────────
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
- id: tool-web
  disabled: true

# ── subagents / workflows ─────────────────────────────────────────────────────
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true

# ── skills / goals / jobs / todo ──────────────────────────────────────────────
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-ralph
  disabled: true

# ── commands & companions (slash commands, session titles) ───────────────────
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: command-goal
  disabled: true
- id: command-compact
  disabled: true
- id: plan-mode
  disabled: true
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
