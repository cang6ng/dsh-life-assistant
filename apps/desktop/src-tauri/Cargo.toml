[package]
name = "chinook-desktop"
version = "1.0.0"
description = "DSH Life Assistant — Windows desktop presentation of the personal agent (window/lifecycle/sidecar only, never business logic); Chinook Music is the current domain"
edition = "2021"

[lib]
name = "chinook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
