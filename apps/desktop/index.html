<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the engine this document can be either scheme, so the canvas it
         paints before any CSS lands follows `color-scheme` below. -->
    <meta name="color-scheme" content="light dark" />
    <title>DSH Life Assistant</title>
    <script>
      // Pre-paint scheme (§18 as amended by v1.0.4). This runs before the
      // bundle, so a dark launch does not flash a white canvas while React
      // boots. It cannot import src/store/themePreference.ts, so the key is
      // duplicated here — tests/architecture-desktop.test.ts pins the two
      // copies together. Anything unrecognised means 追随系统, i.e. the OS.
      (function () {
        try {
          var pref = window.localStorage.getItem("chinook.theme");
          document.documentElement.style.colorScheme =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (e) {
          document.documentElement.style.colorScheme = "light dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
